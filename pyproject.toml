[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "appening-agentic-rag"
version = "0.1.0"
description = "Grounded Agentic AI eBook RAG chatbot built with LangGraph and FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "langgraph>=0.2,<2",
  "langchain-core>=0.3,<2",
  "langchain-openai>=0.2,<2",
  "langchain-text-splitters>=0.3,<2",
  "langchain-chroma>=0.1,<2",
  "langchain-pinecone>=0.2,<1",
  "pypdf>=5,<7",
  "pydantic-settings>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
appening-ingest = "appening_rag.ingestion:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
